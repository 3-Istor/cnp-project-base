{{- if .Values.features.workloads }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "cnp-project-base.systemNamespace" . }}
  labels:
    project: {{ .Values.projectName }}
    prod-gateway-access: "true"
    {{- include "cnp-project-base.podSecurityLabels" . | nindent 4 }}
    {{- include "cnp-project-base.labels" . | nindent 4 }}
    {{- include "cnp-project-base.deletionProtectionLabel" . | nindent 4 }}
    {{- include "cnp-project-base.logRetentionLabel" . | nindent 4 }}
{{- /*
  App namespaces are owned here rather than created by each app's
  CreateNamespace=true: Argo CD never deletes a namespace it created that way,
  so removing an app from the registry used to leave its namespace, and
  everything Argo CD did not create in it (CNPG volumes), behind. Owned here,
  the namespace is pruned when the app leaves the record.

  Except for imported apps (service, backing): a backing app's data lives in
  a PVC that only the namespace deletion removes, and a bad registry write
  must not be enough to lose it. Argo CD leaves their namespace out of the
  prune; the CMP deletes it once the user confirms. Deleting the whole
  project still removes it with the bootstrap Application.
*/}}
{{- range $app := .Values.apps }}
{{- range $env := ($app.environments | default (list "prod")) }}
{{- $ns := printf "%s-%s%s" $.Values.projectName $app.name (ternary "" "-stg" (eq $env "prod")) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  {{- if has ($app.type | default "") (list "service" "backing") }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  {{- end }}
  labels:
    {{- include "cnp-project-base.podSecurityLabels" $ | nindent 4 }}
    {{- include "cnp-project-base.labels" $ | nindent 4 }}
    {{- if eq $env "prod" }}
    {{- include "cnp-project-base.deletionProtectionLabel" $ | nindent 4 }}
    {{- end }}
    {{- include "cnp-project-base.logRetentionLabel" $ | nindent 4 }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cnp-project-quota
  namespace: {{ $ns }}
  labels:
    {{- include "cnp-project-base.labels" $ | nindent 4 }}
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    pods: "10"
---
{{- /* A requests quota rejects pods without requests (CNPG instances are BestEffort). */}}
apiVersion: v1
kind: LimitRange
metadata:
  name: cnp-project-defaults
  namespace: {{ $ns }}
  labels:
    {{- include "cnp-project-base.labels" $ | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
{{- end }}
{{- end }}
{{- end }}
