{{- if and .Values.features.workloads .Values.features.projectRbac (eq .Values.targetCloud "onprem") }}
{{- /*
  kubectl access over OIDC: only the K3s API server trusts the Keycloak issuer,
  so the clouds get nothing until their clusters do. The prefix is the API
  server's oidc-groups-prefix (K3s/node-config/k3s-server/config.yaml).

  Admins only view the system namespace: write access there would let them run a pod as
  offhours-guard, whose ClusterRole patches every Deployment in the cluster.
*/}}
{{- $system := include "cnp-project-base.systemNamespace" . }}
{{- $members := printf "oidc:project-%s-members" .Values.projectName }}
{{- $admins := printf "oidc:project-%s-admins" .Values.projectName }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-{{ .Values.projectName }}-view
  namespace: {{ $system }}
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $members | quote }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $admins | quote }}
{{- range include "cnp-project-base.appNamespaces" . | fromJsonArray }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-{{ $.Values.projectName }}-view
  namespace: {{ . }}
  labels:
    {{- include "cnp-project-base.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $members | quote }}
{{- /*
  Not the built-in edit: it also grants NetworkPolicies, ServiceAccounts and
  whatever CRDs aggregate into it, which would let admins widen the project's
  ingress or reach around the tenant AppProject's blacklist with kubectl.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: project-{{ $.Values.projectName }}-operator
  namespace: {{ . }}
  labels:
    {{- include "cnp-project-base.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  {{- /* kubectl exec and port-forward open the stream with GET over websockets since 1.30. */}}
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["events", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-{{ $.Values.projectName }}-operator
  namespace: {{ . }}
  labels:
    {{- include "cnp-project-base.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: project-{{ $.Values.projectName }}-operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ $admins | quote }}
{{- end }}
{{- end }}
