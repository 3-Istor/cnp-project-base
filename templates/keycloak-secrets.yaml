{{- if and .Values.features.workloads .Values.features.keycloak }}
{{- $ns := include "cnp-project-base.systemNamespace" . -}}
{{- /*
  All three secrets below are minted by Terraform and written to Vault, never
  to etcd directly (D-02) — the operator syncs them from there, same pattern
  as the tunnel token in tunnel.yaml.
*/}}
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: keycloak-admin-password
  namespace: {{ $ns }}
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  path: project-{{ .Values.projectName }}/system/keycloak-admin
  vaultRole: project-{{ .Values.projectName }}-system-role
  type: kubernetes.io/basic-auth
  keys:
    - username
    - password
---
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: keycloak-broker-secret
  namespace: {{ $ns }}
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  path: project-{{ .Values.projectName }}/system/keycloak-broker
  vaultRole: project-{{ .Values.projectName }}-system-role
  type: Opaque
  keys:
    - client_id
    - client_secret
---
{{- /*
  Synced twice on purpose: the DatabaseRole (keycloak-db.yaml) needs this
  secret in the shared cnp-projects-db namespace, and the Keycloak pod
  (keycloak.yaml) needs it here, in its own namespace — Kubernetes has no
  cross-namespace secretKeyRef. One Vault path, two readers, still one writer.
*/}}
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: keycloak-db-credentials
  namespace: {{ $ns }}
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  path: project-{{ .Values.projectName }}/system/keycloak-db
  vaultRole: project-{{ .Values.projectName }}-system-role
  type: kubernetes.io/basic-auth
  keys:
    - username
    - password
{{- end }}
