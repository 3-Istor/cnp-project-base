{{- if .Values.features.appProject }}
{{- /*
  The AppProject lives in the argocd namespace on the CONTROL PLANE cluster,
  not on the project's target cluster. When a project runs on AWS, rendering
  this into the AWS cluster creates an object Argo CD never reads.

  So it is gated: the ApplicationSet creates two Applications per project — one
  carrying the AppProject to the control plane, one carrying the workloads to
  the project's cluster.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.projectName }}
  namespace: argocd
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
spec:
  description: "Isolated boundaries for project {{ .Values.projectName }}"
  sourceRepos: ["*"]
  destinations:
    {{- /*
      Restricted to this project's cluster, addressed by name. A mis-generated
      Application cannot land on the wrong cloud (D-03) — Argo CD rejects it.
    */}}
    - namespace: "{{ .Values.projectName }}-*"
      name: {{ .Values.targetCloud | quote }}
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: "Namespace"
    - group: "rbac.authorization.k8s.io"
      kind: "ClusterRole"
    - group: "rbac.authorization.k8s.io"
      kind: "ClusterRoleBinding"
  roles:
    - name: "project-admins"
      description: "Admin privileges for {{ .Values.projectName }}"
      policies:
        - "p, proj:{{ .Values.projectName }}:project-admins, applications, *, {{ .Values.projectName }}/*, allow"
      groups: ["project-{{ .Values.projectName }}-admins"]
    - name: "project-members"
      description: "Read-only privileges for {{ .Values.projectName }}"
      policies:
        - "p, proj:{{ .Values.projectName }}:project-members, applications, get, {{ .Values.projectName }}/*, allow"
      groups: ["project-{{ .Values.projectName }}-members"]
{{- end }}
