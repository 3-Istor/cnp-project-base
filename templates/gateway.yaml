{{- if and .Values.features.workloads .Values.features.gateway }}
{{- $ns := include "cnp-project-base.systemNamespace" . -}}
{{- /*
  Envoy Gateway deploys the actual proxy (and its Service) into its own
  operator-wide namespace, named by hashing the Gateway's identity — a
  different, unpredictable name per project. Gateway.spec.infrastructure
  lets a Gateway pin that Service to a name we choose instead, which the
  ExternalName Service below can then reference by construction rather than
  guessing. This EnvoyProxy fully replaces (not merges with) the
  GatewayClass-level one (gateway-infra/custom-proxy-config) for this
  Gateway, so it repeats that config's settings deliberately.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.projectName }}-envoy-config
  namespace: {{ $ns }}
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: {{ .Values.projectName }}-envoy
        type: ClusterIP
        externalTrafficPolicy: Local
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.projectName }}-gateway
  namespace: {{ $ns }}
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ .Values.projectName }}-envoy-config
  listeners:
    - name: http-wildcard
      protocol: HTTP
      port: 80
      hostname: "*.{{ .Values.domain }}"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              {{- /*
                Per-project, not the global prod-gateway-access: "true" the shared
                gateway uses. With the global label a route in project A can
                attach to project B's Gateway, which is exactly the blast radius
                a per-project Gateway exists to prevent.
              */}}
              cnp.3istor.com/project: {{ .Values.projectName | quote }}
---
{{- /*
  A Kubernetes Service can only select pods in its own namespace, and Envoy
  Gateway's managed proxy always lands in the controller's namespace
  (envoy-gateway-system here), never the Gateway's own — so a selector-based
  Service here could never have endpoints regardless of which labels it used
  (confirmed live: 0 endpoints, every request 502). ExternalName aliases to
  the real Service instead, at the name the EnvoyProxy above pinned it to.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.projectName }}-gateway-front
  namespace: {{ $ns }}
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.projectName }}-envoy.envoy-gateway-system.svc.cluster.local
  ports:
    - name: http
      port: 80
      protocol: TCP
---
{{- /*
  Currently attached only to the shared gateway. Losing it on a per-project
  Gateway silently breaks client IP for every app behind it — the request
  succeeds, the logged address is Cloudflare's.
*/}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ .Values.projectName }}-trust-cloudflare
  namespace: {{ include "cnp-project-base.systemNamespace" . }}
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.projectName }}-gateway
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: {{ .Values.gateway.numTrustedHops }}
{{- end }}
