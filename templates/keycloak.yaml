{{- if and .Values.features.workloads .Values.features.keycloak }}
{{- $ns := include "cnp-project-base.systemNamespace" . -}}
{{- $dbname := include "cnp-project-base.keycloakDbName" . -}}
{{- $issuer := include "cnp-project-base.keycloakIssuer" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.projectName }}-keycloak
  namespace: {{ $ns }}
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.projectName }}-keycloak
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.projectName }}-keycloak
  namespace: {{ $ns }}
  labels:
    {{- include "cnp-project-base.labels" . | nindent 4 }}
    component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.projectName }}-keycloak
  template:
    metadata:
      labels:
        app: {{ .Values.projectName }}-keycloak
        {{- include "cnp-project-base.labels" . | nindent 8 }}
    spec:
      # Theme pipeline: same decoupled InitContainer + shared emptyDir pattern
      # as the central instance (K3s/k8s/config/keycloak/values.yaml) — an
      # image swap gets a theme update everywhere, no rebuild of this chart.
      initContainers:
        - name: theme-provider-init
          image: {{ .Values.keycloak.theme.image }}
          imagePullPolicy: Always
          volumeMounts:
            - name: theme-providers
              mountPath: /providers
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          command:
            - "/opt/keycloak/bin/kc.sh"
            - "start"
            - "--http-port=8080"
          env:
            - name: KC_PROXY
              value: edge
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Pinned identically for the browser and for Envoy (R-3) — never
            # a .svc address here.
            - name: KC_HOSTNAME
              value: {{ $issuer | quote }}
            - name: KC_HOSTNAME_ADMIN
              value: {{ $issuer | quote }}
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "true"
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-password
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-password
                  key: password
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: "{{ .Values.keycloak.db.cluster }}-rw.{{ .Values.keycloak.db.namespace }}.svc.cluster.local"
            - name: KC_DB_URL_PORT
              value: "5432"
            - name: KC_DB_URL_DATABASE
              value: {{ $dbname | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: password
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 1
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            timeoutSeconds: 1
            failureThreshold: 60
            periodSeconds: 5
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: theme-providers
              mountPath: /opt/keycloak/providers
      volumes:
        - name: theme-providers
          emptyDir: {}
{{- end }}
