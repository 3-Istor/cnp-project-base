projectName: "default"

# Mirrors the registry record's spec.targetCloud. Used as a uniform marker on
# every object so the cleanup job can find them (D-13), not to make placement
# decisions — Argo CD's destination does that.
targetCloud: "onprem"

domain: "3istor.com"

features:
  # The AppProject goes to the control plane cluster; the workloads go to the
  # project's cluster. Two Applications, one chart, different flags.
  appProject: true
  workloads: true

  gatus: true
  # Per-project ingress unit (D-05, D-06). Off by default: existing projects
  # attach to the shared gateway and rely on the account-wide tunnel, and
  # turning these on is a per-project migration, not a chart upgrade.
  gateway: false
  tunnel: false
  # Dedicated per-project identity (WS-5, D-04). Off by default — existing
  # projects keep using the central Keycloak's tenant realm until they're
  # migrated on purpose, not as a side effect of a chart upgrade.
  keycloak: false

gateway:
  # The cluster team owns the GatewayClass and the controller; CNP creates and
  # destroys the Gateway object at project level.
  className: eg
  numTrustedHops: 1
  # Where routes attach when features.gateway is false.
  shared:
    name: shared-gateway
    namespace: gateway-infra

tunnel:
  image: cloudflare/cloudflared:latest
  replicas: 1
  # Application hostnames this project's connector serves, in addition to the
  # status- and offhours- hostnames which are always included. Rendered from the
  # registry record's spec.apps[].hostnames.
  hostnames: []
  resources:
    requests:
      cpu: "10m"
      memory: "16Mi"
    limits:
      cpu: "50m"
      memory: "32Mi"

offhours-guard:
  fullnameOverride: "offhours-guard"

keycloak:
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.5.5"
  theme:
    image: ghcr.io/thegostsniperfr/keycloak-theme-kube-lab:latest
  configCli:
    image: adorsys/keycloak-config-cli:6.5.1
    # keycloak-config-cli's own wait-for-Keycloak, so the PostSync Job doesn't
    # need a hand-rolled retry loop. Generous because the pod's own
    # startupProbe already allows up to 5 minutes.
    availabilityCheckTimeout: "180s"
  resources:
    requests:
      cpu: "50m"
      memory: "512Mi"
    limits:
      memory: "512Mi"
  db:
    # Shared Postgres every project's dedicated Keycloak database lives inside
    # (WS-5's cost argument — a pod-and-a-half per project, not two).
    # K3s/k8s/config/cnp-projects-db.
    cluster: cnp-projects-keycloak
    namespace: cnp-projects-db
