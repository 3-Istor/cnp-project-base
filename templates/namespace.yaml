{{- if .Values.features.workloads }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "cnp-project-base.systemNamespace" . }}
  labels:
    project: {{ .Values.projectName }}
    prod-gateway-access: "true"
    {{- include "cnp-project-base.podSecurityLabels" . | nindent 4 }}
    {{- include "cnp-project-base.labels" . | nindent 4 }}
    {{- include "cnp-project-base.logRetentionLabel" . | nindent 4 }}
{{- /*
  App namespaces are owned here rather than created by each app's
  CreateNamespace=true: Argo CD never deletes a namespace it created that way,
  so removing an app from the registry used to leave its namespace, and
  everything Argo CD did not create in it (CNPG volumes), behind. Owned here,
  the namespace is pruned when the app leaves the record.
*/}}
{{- range .Values.apps }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $.Values.projectName }}-{{ .name }}
  labels:
    {{- include "cnp-project-base.podSecurityLabels" $ | nindent 4 }}
    {{- include "cnp-project-base.labels" $ | nindent 4 }}
    {{- include "cnp-project-base.logRetentionLabel" $ | nindent 4 }}
{{- end }}
{{- end }}
