suite: tenant egress
templates:
  - templates/network-egress.yaml
set:
  projectName: shop
  features.egressIsolation: true
  apps:
    - {name: api, type: fullstack, environments: [prod, staging]}
tests:
  - it: renders nothing until the project turns it on
    set:
      features.egressIsolation: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing on the clouds, which have no Cilium
    set:
      targetCloud: aws
    asserts:
      - hasDocuments:
          count: 0

  - it: covers every app namespace and environment, not the system one
    asserts:
      - hasDocuments:
          count: 6
      - matchRegex:
          path: metadata.namespace
          pattern: ^shop-api(-stg)?$

  - it: allows DNS, the project, the collector and the public Internet only
    documentIndex: 0
    asserts:
      - equal:
          path: spec.endpointSelector
          value: {}
      - lengthEqual:
          path: spec.egress
          count: 4
      - equal:
          path: spec.egress[1].toEndpoints[0].matchLabels
          value:
            k8s:io.cilium.k8s.namespace.labels.cnp.3istor.com/project: shop

  - it: keeps the lab, OpenStack and metadata ranges out of the Internet rule
    documentIndex: 0
    asserts:
      - contains:
          path: spec.egress[3].toCIDRSet[0].except
          content: 192.168.0.0/16
      - contains:
          path: spec.egress[3].toCIDRSet[0].except
          content: 172.16.0.0/12
      - contains:
          path: spec.egress[3].toCIDRSet[0].except
          content: 10.0.0.0/8
      - contains:
          path: spec.egress[3].toCIDRSet[0].except
          content: 169.254.0.0/16
      - contains:
          path: spec.egress[3].toCIDRSet[0].except
          content: 176.132.254.63/32

  - it: opens the RGW only to pods labelled for it
    documentIndex: 1
    asserts:
      - equal:
          path: spec.endpointSelector.matchLabels
          value:
            cnp.3istor.com/egress-rgw: "true"
      - equal:
          path: spec.egress[0].toCIDR
          value: [192.168.1.110/32]
      - equal:
          path: spec.egress[0].toPorts[0].ports[0].port
          value: "7480"

  - it: opens the API server to CNPG pods only
    documentIndex: 2
    asserts:
      - equal:
          path: spec.endpointSelector.matchExpressions
          value:
            - key: cnpg.io/podRole
              operator: Exists
      - equal:
          path: spec.egress[0].toEntities
          value: [kube-apiserver]
